name: zinc
seed: 42
root: outputs/datasets
pyg_root: outputs/raw_datasets/zinc

# PyG ZINC supports subset=true for the 12k benchmark subset and subset=false
# for the full molecular dataset. Official train/val/test splits are used by default.
subset: true
use_official_splits: true
max_graphs: null
max_train_graphs: null
max_val_graphs: null
max_test_graphs: null
shuffle: false
remove_self_loops: true

# Molecular attribute conversion.
include_node_features: true
include_edge_features: true
include_targets: true
target_index: null

preprocessing:
  make_undirected: true
  relabel_nodes: true
  graph_size_filter:
    min_nodes: 1
    max_nodes: null

# Used only when use_official_splits=false, or to apportion max_graphs when
# official-split caps are not supplied.
split:
  train: 0.8
  val: 0.1
  test: 0.1

# Canonical NetworkX schema used after conversion from PyG Data objects.
graph_attributes:
  enabled: auto
  node_feature_attr: feats
  node_label_attr: node_label
  edge_feature_attr: edge_attr
  edge_label_attr: edge_type
  graph_label_attr: graph_label
  node_label_aliases: [label, node_type, type, atom_type, atomic_number, x_label]
  node_feature_aliases: [feature, features, x, node_features]
  edge_label_aliases: [label, edge_label, bond_type, type, bond]
  edge_feature_aliases: [feature, features, weight, edge_features]
  graph_label_aliases: [y, label, class]
  add_default_node_features: true
  add_default_node_labels: true
  add_default_edge_labels: true
  default_node_feature_dim: 1
  generated_attribute_strategy: empirical
  overwrite_generated_attributes: false
