seed: 42
num_runs: 3
real_dataset_num_runs: 1
single_run_datasets:
- qm9
- zinc
molecular_datasets:
- qm9
- zinc
num_generated_graphs: 1024
num_reference_graphs: 1024
force: false
continue_on_error: true
datasets:
- sbm
- planar
models:
- dummy
- graphguide
- digress
- construct
- edp_gnn
- disco
- grum
metrics:
  descriptor:
    enabled: true
    reference_split: test
    descriptors:
    - degree
    - clustering
    - orbit
    - spectral
    - structural_summary
    discrepancy: mmd
    kernel:
      histograms: gaussian_emd
      vectors: rbf
    bootstrap_rounds: 20
    skip_orbit: true
  learned_feature:
    enabled: true
    reference_split: train
    encoder: wl_subtree
    feature_dim: 128
    wl_iterations: 3
    discrepancy: mmd
    bootstrap_rounds: 20
  classifier:
    enabled: true
    reference_split: test
    classifier: auto
    metric: pgs_js_distance
    cv_folds: 4
    skip_orbits: true
    num_splits: 3
  polygraphscore_official:
    enabled: false
    polygraph_root: null
    reference_split: test
    mode: point
    variant: jsd
    classifier: tabpfn
    descriptors:
    - orbit4
    - orbit5
    - degree
    - clustering
    - spectral
    - gin
    skip_orbits: false
    skip_orbits_when_unavailable: false
    num_splits: 1
    subsample_size: null
    num_samples: 10
    metric_filename: polygraphscore_official.json
    skip_orbits_if_unavailable: false
    allow_orbit_count_fallback: true
    orca_exec: null
    auto_compile_orca: true
    skip_gin: false
