reference_split: train
encoder: wl_subtree
wl_iterations: 3
feature_dim: 128
discrepancy: mmd
bootstrap_rounds: 20
note: wl_subtree is a fitted Weisfeiler-Lehman subtree feature encoder. structural and random_gin are retained as lightweight ablations/backward-compatible fallbacks.
reference_split_note: Generated-vs-training feature-space MMD by default.
