[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-comparison"
version = "0.1.0"
description = "Benchmark scaffold for graph generative model survey experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "pandas",
  "PyYAML",
  "scikit-learn",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
